<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Counting - Barcode Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #1e1e1e; border-radius: 16px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; }
    .upload-box { border: 2px dashed #444; padding: 25px 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 15px; background: #252525; }
    .upload-box:hover { border-color: #2196F3; background: #2a2a2a; }
    input[type="file"] { display: none; }
    .filter-group { margin-top: 15px; text-align: left; }
    .filter-group label { font-size: 12px; color: #aaa; display: block; margin-bottom: 5px; }
    .filter-group input, .filter-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; font-size: 14px; margin-bottom: 10px; }
    .btn-main { width: 100%; padding: 14px; font-weight: bold; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; font-size: 15px; }
    .btn-main:disabled { background: #444; cursor: not-allowed; }
    .viewer { display: none; }
    .badge { background: #ff9800; color: #000; font-weight: bold; font-size: 12px; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
    .sku-name { font-size: 15px; font-weight: 600; min-height: 44px; display: flex; align-items: center; justify-content: center; color: #e0e0e0; }
    .barcode-box { background: white; padding: 15px; border-radius: 8px; margin: 15px 0; }
    svg { width: 100%; height: auto; }
    .meta { font-size: 13px; color: #aaa; margin-bottom: 20px; }
    .nav-btns { display: flex; gap: 12px; }
    .btn-nav { flex: 1; padding: 16px; font-size: 15px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; }
    .btn-prev { background: #333; color: #ccc; }
    .btn-next { background: #2196F3; color: white; }
    .progress { font-size: 12px; color: #777; margin-top: 15px; }
    .btn-reset { background: transparent; color: #ff5252; border: none; margin-top: 15px; cursor: pointer; font-size: 12px; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <div id="setup-section">
    <h2>Upload Data Stock</h2>
    <div class="upload-box" onclick="document.getElementById('excel-file').click()">
      <div id="file-label">📁 Klik untuk pilih File Excel (.xlsx / .csv)</div>
      <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" onchange="handleFileSelect(event)">
    </div>

    <div class="filter-group">
      <label>Filter Keyword (Pisahkan koma):</label>
      <input type="text" id="filter-keyword" placeholder="Contoh: MOUNTAINEERING, SANDAL">
      
      <label>Urutan Data (Sort By Bin):</label>
      <select id="sort-order">
        <option value="bin-asc">Bin Code (A - Z) [Rekomendasi]</option>
        <option value="bin-desc">Bin Code (Z - A)</option>
        <option value="none">Sesuai Urutan File Excel</option>
      </select>
    </div>

    <button id="btn-process" class="btn-main" onclick="processExcel()" disabled>Generate Barcode</button>
  </div>

  <div id="viewer-section" class="viewer">
    <span class="badge" id="bin-code">BIN: -</span>
    <div class="sku-name" id="sku-name">Nama Barang</div>
    
    <div class="barcode-box">
      <svg id="barcode"></svg>
    </div>

    <div class="meta" id="sku-code">SKU: -</div>
    
    <div class="nav-btns">
      <button class="btn-nav btn-prev" onclick="prevBar()">PREV</button>
      <button class="btn-nav btn-next" onclick="nextBar()">NEXT &#10095;</button>
    </div>

    <div class="progress" id="progress">0 / 0</div>
    <button class="btn-reset" onclick="resetApp()">Upload File Lain</button>
  </div>
</div>

<script>
  let rawData = [];
  let items = [];
  let currentIndex = 0;

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('file-label').innerText = "📄 " + file.name;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.SheetNames[0];
      rawData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

      document.getElementById('btn-process').disabled = false;
      document.getElementById('btn-process').innerText = `Proses ${rawData.length} Baris Data`;
    };
    reader.readAsArrayBuffer(file);
  }

  function processExcel() {
    const keywordInput = document.getElementById('filter-keyword').value.trim().toUpperCase();
    const sortOrder = document.getElementById('sort-order').value;
    const keywords = keywordInput ? keywordInput.split(',').map(k => k.trim()) : [];

    items = [];
    
    rawData.forEach(row => {
      const sku = String(row['SKU Code'] || row['SKU'] || '').trim();
      const name = String(row['SKU Name'] || row['Name'] || '').trim();
      const bin = String(row['Bin Code'] || row['Bin'] || '-').trim();

      if (!sku) return;

      const rowString = Object.values(row).join(' ').toUpperCase();

      let isMatch = true;
      if (keywords.length > 0) {
        isMatch = keywords.every(kw => rowString.includes(kw));
      }

      if (isMatch) {
        items.push({ sku, name, bin });
      }
    });

    if (items.length === 0) {
      alert("Tidak ada data yang cocok dengan filter!");
      return;
    }

    // LAKUKAN SORTING BERDASARKAN BIN CODE
    if (sortOrder === 'bin-asc') {
      items.sort((a, b) => a.bin.localeCompare(b.bin, undefined, { numeric: true, sensitivity: 'base' }));
    } else if (sortOrder === 'bin-desc') {
      items.sort((a, b) => b.bin.localeCompare(a.bin, undefined, { numeric: true, sensitivity: 'base' }));
    }

    document.getElementById('setup-section').style.display = 'none';
    document.getElementById('viewer-section').style.display = 'block';
    
    currentIndex = 0;
    render();
  }

  function render() {
    if (items.length === 0) return;
    const item = items[currentIndex];

    document.getElementById('sku-name').innerText = item.name || 'Tanpa Nama';
    document.getElementById('bin-code').innerText = "BIN: " + item.bin;
    document.getElementById('sku-code').innerText = "SKU: " + item.sku;
    document.getElementById('progress').innerText = `${currentIndex + 1} dari ${items.length} Item`;

    JsBarcode("#barcode", item.sku, {
      format: "CODE128",
      lineColor: "#000",
      width: 2,
      height: 70,
      displayValue: true,
      fontSize: 15
    });
  }

  function nextBar() {
    if (currentIndex < items.length - 1) {
      currentIndex++;
      render();
    }
  }

  function prevBar() {
    if (currentIndex > 0) {
      currentIndex--;
      render();
    }
  }

  function resetApp() {
    document.getElementById('setup-section').style.display = 'block';
    document.getElementById('viewer-section').style.display = 'none';
    document.getElementById('excel-file').value = '';
    document.getElementById('file-label').innerText = "📁 Klik untuk pilih File Excel (.xlsx / .csv)";
    document.getElementById('btn-process').disabled = true;
    document.getElementById('btn-process').innerText = "Generate Barcode";
  }

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('viewer-section').style.display === 'block') {
      if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        nextBar();
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevBar();
      }
    }
  });
</script>
</body>
</html>
